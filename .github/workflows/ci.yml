name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: node --test test/

  no-dependencies:
    name: no runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package.json declares no dependencies
        run: |
          node -e '
            const p = require("./package.json");
            const deps = { ...p.dependencies, ...p.optionalDependencies, ...p.peerDependencies };
            if (Object.keys(deps).length) {
              console.error("peek must install with no package manager. Found:", deps);
              process.exit(1);
            }
          '
      - name: vendored bundles are present and load
        run: |
          node -e '
            const { Marked } = require("./vendor/marked.cjs");
            const hljs = require("./vendor/highlight.min.js");
            require("fs").accessSync("./vendor/mermaid.min.js");
            if (!new Marked().parse("# x").includes("<h1")) throw new Error("marked bundle is broken");
            if (!hljs.highlight("x=1", { language: "python" }).value) throw new Error("highlight bundle is broken");
            console.log("vendored bundles OK");
          '
      - name: no stray node_modules committed
        run: test ! -d node_modules

  manifests:
    name: plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: manifests parse and agree
        run: |
          node -e '
            const fs = require("fs");
            const plugin = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8"));
            const market = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            JSON.parse(fs.readFileSync("hooks/hooks.json", "utf8"));
            if (!/^[a-z][a-z0-9]*(-[a-z0-9]+)*$/.test(plugin.name)) throw new Error("bad plugin name");
            if (!market.plugins.some(p => p.name === plugin.name)) throw new Error("marketplace does not list the plugin");
            console.log("manifests OK:", plugin.name, plugin.version);
          '
      - name: every command file has frontmatter
        run: |
          for f in commands/*.md; do
            head -1 "$f" | grep -q '^---$' || { echo "missing frontmatter: $f"; exit 1; }
            grep -q '^description:' "$f" || { echo "missing description: $f"; exit 1; }
          done
          echo "commands OK"
